
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Calculator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
          background: #f1f3f5;
        }

        .calculator {
          width: 350px;
          max-width: 100%;
          background: #212529;
          padding: 20px;
          border-radius: 20px;
          box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .display {
          height: 90px;
          background: #343a40;
          color: white;
          border-radius: 12px;
          margin-bottom: 20px;
          padding: 15px;
          text-align: right;
          overflow: hidden;
        }

        #previous {
          height: 25px;
          color: #adb5bd;
          font-size: 15px;
        }

        #display {
          font-size: 35px;
          font-weight: 500;
        }

        .calculator button {
          height: 60px;
          font-size: 20px;
          font-weight: 500;
          border-radius: 12px;
        }

        .btn-number {
          background: #495057;
          color: white;
          border: none;
        }

        .btn-number:hover {
          background: #6c757d;
          color: white;
        }

        .btn-operator {
          background: #fd7e14;
          color: white;
          border: none;
        }

        .btn-operator:hover {
          background: #e96b02;
          color: white;
        }

        .btn-action {
          background: #adb5bd;
          color: #212529;
          border: none;
        }

        .btn-action:hover {
          background: #ced4da;
        }

        .btn-equal {
          background: #0d6efd;
          color: white;
          border: none;
        }

        .btn-equal:hover {
          background: #0b5ed7;
          color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="d-flex justify-content-center align-items-center vh-100">

        <div class="calculator">

            <!-- Display -->
            <div class="display">

              <div id="previous"></div>
              <div id="display">0</div>

            </div>


            <!-- Calculator Buttons -->
            <div class="row g-2">

                <!-- Row 1 -->

                <div class="col-3">
                    <button class="btn btn-action w-100" onclick="clearCalculator()">
                        AC
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-action w-100"
                        onclick="deleteNumber()">
                        DEL
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-action w-100"
                        onclick="percentage()">
                        %
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-operator w-100"
                        onclick="chooseOperator('/')">
                        ÷
                    </button>
                </div>


                <!-- Row 2 -->

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('7')">
                        7
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('8')">
                        8
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('9')">
                        9
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-operator w-100"
                        onclick="chooseOperator('*')">
                        ×
                    </button>
                </div>


                <!-- Row 3 -->

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('4')">
                        4
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('5')">
                        5
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('6')">
                        6
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-operator w-100"
                        onclick="chooseOperator('-')">
                        −
                    </button>
                </div>


                <!-- Row 4 -->

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('1')">
                        1
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('2')">
                        2
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('3')">
                        3
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-operator w-100"
                        onclick="chooseOperator('+')">
                        +
                    </button>
                </div>


                <!-- Row 5 -->

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('0')">
                        0
                    </button>
                </div>

                <div class="col-3">
                    <button
                        class="btn btn-number w-100"
                        onclick="appendNumber('.')">
                        .
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-equal w-100"
                        onclick="calculate()">
                        =
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // Store calculator values
    let currentNumber = "";
    let previousNumber = "";
    let operator = "";


    // Get display elements
    let display = document.getElementById("display");
    let previousDisplay = document.getElementById("previous");


    // Add number to display
    function appendNumber(number) {

        if (number === "." && currentNumber.includes(".")) {
            return;
        }

        currentNumber = currentNumber + number;

        display.innerText = currentNumber;
    }


    // Select operator
    function chooseOperator(selectedOperator) {

        if (currentNumber === "") {
            return;
        }

        previousNumber = currentNumber;

        operator = selectedOperator;

        currentNumber = "";

        previousDisplay.innerText =
            previousNumber + " " + operator;

    }


    // Calculate result
    function calculate() {

        if (
            previousNumber === "" ||
            currentNumber === "" ||
            operator === ""
        ) {
            return;
        }

        let number1 = Number(previousNumber);
        let number2 = Number(currentNumber);

        let result;


        if (operator === "+") {

            result = number1 + number2;

        }
        else if (operator === "-") {

            result = number1 - number2;

        }
        else if (operator === "*") {

            result = number1 * number2;

        }
        else if (operator === "/") {

            if (number2 === 0) {

                display.innerText = "Error";

                return;
            }

            result = number1 / number2;

        }


        display.innerText = result;

        currentNumber = result.toString();

        previousNumber = "";

        operator = "";

        previousDisplay.innerText = "";
    }


    // Clear calculator
    function clearCalculator() {

        currentNumber = "";
        previousNumber = "";
        operator = "";

        display.innerText = "0";

        previousDisplay.innerText = "";
    }


    // Delete last number
    function deleteNumber() {

        currentNumber = currentNumber.slice(0, -1);

        if (currentNumber === "") {

            display.innerText = "0";

        } else {

            display.innerText = currentNumber;

        }
    }


    // Percentage
    function percentage() {

        if (currentNumber === "") {
            return;
        }

        currentNumber = Number(currentNumber) / 100;

        display.innerText = currentNumber;
    }

</script>

</body>
</html>
